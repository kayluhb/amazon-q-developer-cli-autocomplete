name: Typos

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check spelling
        uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master (2026-10-14)
        with:
          config: .typos.toml