name: Rust

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  cargo-clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies (macOS)
        if: runner.os == 'Macos'
        run: brew install protobuf fish shellcheck
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-14)
        id: toolchain
        with:
          toolchain: 1.84.0
          components: clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
      - run: cargo clippy --locked --workspace --color always -- -D warnings

  cargo-test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest]
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies (macOS)
        if: runner.os == 'Macos'
        run: brew install protobuf fish shellcheck
      # this needs to be nightly for code coverage
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-14)
        id: toolchain
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
      # TODO: Coverage fails with `error: unnecessary transmute` in `appkit-nsworkspace-bindings`
      # - name: Generate code coverage
      #   run: cargo +nightly llvm-cov --locked --workspace --codecov --output-path lcov.info
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v5
      #   if: github.event.repository.fork == false
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: lcov.info
      #     fail_ci_if_error: true
      #     env_vars: OS
      - name: Run tests
        run: cargo test --locked --workspace --lib --bins --test '*' --exclude tab_desktop-fuzz

  cargo-fmt:
    name: Fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned: newer nightlies reformat the existing code
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-14)
        with:
          toolchain: nightly-2025-11-01
          components: rustfmt
      - run: cargo +nightly-2025-11-01 fmt --check -- --color always

  cargo-deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
